<button type="button" class="btn btn-success" (click)="getData()"> Get Data</button>
<button type="button" class="btn btn-dark" (click)="logOut()"> Log out</button>

<div class="login-container">
    <div class="card shadow p-4 text-center">
      <h3 class="mb-4">Autenticando con nuestro servidor...</h3>
      <div class="spinner-container">
        <div class="spinner-border" style="width: 3rem; height: 3rem;" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
      <p class="mt-3">Por favor espera mientras validamos tus credenciales.</p>
    </div>
</div>
