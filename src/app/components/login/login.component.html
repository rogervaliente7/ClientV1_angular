<br><br><br><br><br>
<div class="login-container">
  <div class="card shadow p-4">
    <h3 class="text-center mb-4">Sign in</h3>
    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input 
          type="email" 
          class="form-control" 
          id="email" 
          placeholder="Enter your email" 
          [(ngModel)]="email" 
          name="email" 
          required 
        />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input 
          type="password" 
          class="form-control" 
          id="password" 
          placeholder="Enter your password" 
          [(ngModel)]="password" 
          name="password" 
          required 
        />
      </div>

      <div class="form-check mb-3">
        <input 
          class="form-check-input" 
          type="checkbox" 
          id="rememberPassword" 
        />
        <label class="form-check-label" for="rememberPassword">Remember password</label>
      </div>

      <button type="submit" class="btn btn-primary w-100 mb-3" [disabled]="isLoading"><i class="fa-solid fa-right-to-bracket"></i>Login</button>

      <div *ngIf="isLoading" class="text-center mb-3">Autenticando...</div>

      <hr>

      <button type="button" class="btn btn-danger w-100 mb-3" (click)="login()">
        <i class="fa-brands fa-google"></i> Sign in with Google
      </button>

    </form>

    <div class="text-center mt-3">
      <a [routerLink]="'/signup'" class="text-decoration-none">No tienes una cuenta? Regístrate aquí</a>
    </div>
  </div>
</div>
