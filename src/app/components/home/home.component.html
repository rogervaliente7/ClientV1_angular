<div class="dashboard-container">
    <!-- Header -->
    <div class="header">
        <div class="logo-container">
          <img src="images/logo2.jpg" alt="Logo" class="logo" />
          <h2 class="company-name">COMPANY NAME</h2>
        </div>
        <div class="header-right">
          <input type="text" class="search-bar" placeholder="Search..." />
          <h1 class="page-title">DASHBOARD</h1>
        </div>
    </div>
      
  
    <!-- Body -->
    <div class="body">  
      <div class="sidebar">
        <!-- Logo Header -->
        <div class="logo-header">
          <a routerLink="/" class="logo">
            <img
              src="images/logo2.jpg"
              alt="Logo"
              class="logo-image"
            />
          </a>
        </div>
      
        <!-- Sidebar Navigation -->
        <ul class="nav-menu">
          <li class="nav-item">
            <div class="nav-link" (click)="toggleMenu('dashboard')">
              <div class="nav-content">
                <i class="fas fa-home"></i>
                <span>Dashboard</span>
              </div>
              <i class="fas fa-chevron-down arrow" [class.rotated]="menuItems.dashboard"></i>
            </div>
            <ul class="submenu" [class.expanded]="menuItems.dashboard">
              <li><a routerLink="/dashboard1">Dashboard 1</a></li>
              <li><a routerLink="/dashboard2">Dashboard 2</a></li>
            </ul>
          </li>
      
          <li class="nav-item">
            <div class="nav-link" (click)="toggleMenu('modules')">
              <div class="nav-content">
                <i class="fas fa-box"></i>
                <span>Modules</span>
              </div>
              <i class="fas fa-chevron-down arrow" [class.rotated]="menuItems.modules"></i>
            </div>
            <ul class="submenu" [class.expanded]="menuItems.modules">
              <li><a routerLink="/module1">Module 1</a></li>
              <li><a routerLink="/module2">Module 2</a></li>
            </ul>
          </li>
        </ul>


      </div>
      <div class="main-content">
        <div class="empty-content">
          <h2>HOME WORKS</h2>
        </div>
      </div>
    </div>
</div>
